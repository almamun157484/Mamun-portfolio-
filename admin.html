<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="toast" class="glass"></div>
<main style="padding-bottom:60px">
  <div id="login" class="glass pad" style="margin-top:40px" hidden>
    <h2 style="margin:0 0 10px">অ্যাডমিন লগইন</h2>
    <input id="le" class="f" type="email" placeholder="ইমেইল" autocomplete="username">
    <input id="lp" class="f" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
    <div class="err" id="e0"></div>
    <button class="bt" id="lg">লগইন</button>
  </div>
  <div id="panel" hidden>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <h2 style="margin:0;flex:1">অ্যাডমিন প্যানেল</h2>
      <a class="bt s sm" href="index.html" style="text-decoration:none">সাইট দেখো</a>
      <button class="bt s sm" id="out">লগআউট</button>
    </div>
    <div class="tabs"><button class="bt" data-tab="set">সেটিংস</button><button class="bt s" data-tab="post">ব্লগ</button><button class="bt s" data-tab="like">ভালোলাগা</button><button class="bt s" data-tab="edu">শিক্ষা</button><button class="bt s" data-tab="svc">সার্ভিস</button><button class="bt s" data-tab="sec">নতুন সেকশন</button></div>
    <section id="t-set"></section>
    <section id="t-post" hidden></section>
    <section id="t-like" hidden></section>
    <section id="t-edu" hidden></section>
    <section id="t-svc" hidden></section>
    <section id="t-sec" hidden></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="keys.js"></script>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var S=Object.assign({},DEF),editing=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},3200)}
async function up(f){var n=Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');var r=await sb.storage.from('media').upload(n,f);if(r.error)throw r.error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl}
async function run(fn){try{await fn()}catch(e){toast('সমস্যা: '+(e.message||e))}}

var FIELDS=[['hero_name_bn','নাম (বাংলা)'],['hero_name_en','Name (English)'],['words_bn','ঘুরে আসা শব্দ, কমা দিয়ে (বাংলা)'],['words_en','Rotating words, comma separated (English)'],
['intro_bn','ছোট পরিচয় (বাংলা)',1],['intro_en','Intro (English)',1],['about_bn','আমার সম্পর্কে (বাংলা)',1],['about_en','About me (English)',1],
['likes_bn','ভালোলাগা লেখা (বাংলা)',1],['likes_en','Favourites text (English)',1],['contact_bn','যোগাযোগ লেখা (বাংলা)',1],['contact_en','Contact text (English)',1],
['now_bn','এখন শুনছি (বাংলা)'],['now_en','Now listening (English)'],['whatsapp','হোয়াটসঅ্যাপ নম্বর'],['email','ইমেইল'],['facebook','ফেসবুক ইউজারনেম'],['instagram','ইনস্টাগ্রাম ইউজারনেম'],['telegram','টেলিগ্রাম ইউজারনেম']];

function showSet(){
  var h='<div class="glass pad"><label class="lb">প্রোফাইল ছবি</label>'+(S.avatar?'<img src="'+esc(S.avatar)+'" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">':'')+'<input id="s_file" class="f" type="file" accept="image/*">';
  FIELDS.forEach(function(f){var v=esc(S[f[0]]);h+='<label class="lb">'+f[1]+'</label>'+(f[2]?'<textarea class="f" id="s_'+f[0]+'">'+v+'</textarea>':'<input class="f" id="s_'+f[0]+'" value="'+v+'">')});
  $('t-set').innerHTML=h+'<button class="bt" id="s_save" style="margin-top:12px">সেভ করো</button></div>';
  $('s_save').onclick=function(){run(async function(){
    var o={avatar:S.avatar||''},f=$('s_file').files[0];
    FIELDS.forEach(function(x){o[x[0]]=$('s_'+x[0]).value.trim()});
    if(f)o.avatar=await up(f);
    var r=await sb.from('settings').upsert({id:1,data:o});if(r.error)throw r.error;
    S=Object.assign({},DEF,o);toast('সেটিংস সেভ হয়েছে');showSet();
  })};
}
async function showPosts(){
  var r=await sb.from('posts').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;
  var e=editing&&r.data.find(function(p){return p.id===editing})||{};
  var h='<div class="glass pad"><h3 style="margin:0">'+(e.id?'পোস্ট এডিট':'নতুন পোস্ট')+'</h3>';
  [['tbn','শিরোনাম (বাংলা)',e.title_bn],['ten','Title (English)',e.title_en]].forEach(function(x){h+='<label class="lb">'+x[1]+'</label><input class="f" id="p_'+x[0]+'" value="'+esc(x[2])+'">'});
  [['bbn','লেখা (বাংলা)',e.body_bn],['ben','Body (English)',e.body_en]].forEach(function(x){h+='<label class="lb">'+x[1]+'</label><textarea class="f" id="p_'+x[0]+'" style="height:130px">'+esc(x[2])+'</textarea>'});
  h+='<label class="lb">ক্যাটাগরি</label><input class="f" id="p_tag" value="'+esc(e.tag)+'"><label class="lb">কভার ছবি (ঐচ্ছিক)</label><input class="f" id="p_cov" type="file" accept="image/*"><label class="chk"><input type="checkbox" id="p_pub"'+(e.published?' checked':'')+'>পাবলিশ করো (না টিক দিলে ড্রাফট)</label><div class="err" id="e1"></div><button class="bt" id="p_save">সেভ করো</button> '+(e.id?'<button class="bt s" id="p_cancel">বাতিল</button>':'')+'</div><h3>সব পোস্ট</h3>';
  r.data.forEach(function(p){h+='<div class="glass row"><span class="t">'+esc(p.title_bn||p.title_en)+'</span><span class="st'+(p.published?'':' d')+'">'+(p.published?'পাবলিশ':'ড্রাফট')+'</span><button class="bt s sm" data-ed="'+p.id+'">এডিট</button><button class="bt s sm" data-tg="'+p.id+'" data-v="'+(p.published?1:0)+'">'+(p.published?'লুকাও':'পাবলিশ')+'</button><button class="bt s sm" data-dl="'+p.id+'">✕</button></div>'});
  $('t-post').innerHTML=h;
  $('p_save').onclick=function(){run(async function(){
    if(!$('p_tbn').value.trim()&&!$('p_ten').value.trim()){$('e1').textContent='অন্তত একটা শিরোনাম লেখো';return}
    var o={title_bn:$('p_tbn').value.trim(),title_en:$('p_ten').value.trim(),body_bn:$('p_bbn').value.trim(),body_en:$('p_ben').value.trim(),tag:$('p_tag').value.trim(),published:$('p_pub').checked},f=$('p_cov').files[0];
    if(f)o.cover_url=await up(f);
    var q=e.id?await sb.from('posts').update(o).eq('id',e.id):await sb.from('posts').insert(o);if(q.error)throw q.error;
    editing=null;toast('পোস্ট সেভ হয়েছে');await showPosts();
  })};
  if(e.id)$('p_cancel').onclick=function(){editing=null;run(showPosts)};
}
async function showLikes(){
  var r=await sb.from('likes').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;
  var h='<div class="glass pad"><h3 style="margin:0">ভালোলাগা যোগ করো</h3><label class="lb">নাম</label><input class="f" id="l_t"><label class="lb">ধরন</label><select class="f" id="l_k"><option value="photo">ছবি</option><option value="book">বই</option><option value="music">গান</option><option value="link">লিংক</option><option value="moment">মুহূর্ত</option></select><label class="lb">লিংক (ঐচ্ছিক, https:// দিয়ে)</label><input class="f" id="l_u"><label class="lb">ছবি (ঐচ্ছিক)</label><input class="f" id="l_f" type="file" accept="image/*"><div class="err" id="e2"></div><button class="bt" id="l_add">যোগ করো</button></div><h3>সব ভালোলাগা</h3>';
  r.data.forEach(function(x){h+='<div class="glass row"><span class="t">'+esc(x.title)+' · '+esc(x.kind)+'</span><button class="bt s sm" data-dll="'+x.id+'">✕</button></div>'});
  $('t-like').innerHTML=h;
  $('l_add').onclick=function(){run(async function(){
    if(!$('l_t').value.trim()){$('e2').textContent='নাম লেখো';return}
    var o={title:$('l_t').value.trim(),kind:$('l_k').value,url:$('l_u').value.trim()||null},f=$('l_f').files[0];
    if(f)o.image_url=await up(f);
    var q=await sb.from('likes').insert(o);if(q.error)throw q.error;toast('যোগ হয়েছে');await showLikes();
  })};
}
$('t-post').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;run(async function(){
  if(b.dataset.ed){editing=b.dataset.ed;await showPosts();window.scrollTo(0,0)}
  else if(b.dataset.tg){var q=await sb.from('posts').update({published:b.dataset.v!=='1'}).eq('id',b.dataset.tg);if(q.error)throw q.error;await showPosts()}
  else if(b.dataset.dl&&confirm('পোস্টটা ডিলিট করবে?')){var d=await sb.from('posts').delete().eq('id',b.dataset.dl);if(d.error)throw d.error;toast('ডিলিট হয়েছে');await showPosts()}
})});
$('t-like').addEventListener('click',function(ev){var b=ev.target.closest('[data-dll]');if(!b||!confirm('সরাবে?'))return;run(async function(){var d=await sb.from('likes').delete().eq('id',b.dataset.dll);if(d.error)throw d.error;await showLikes()})});
function crud(tab,table,title,F,lbl){
  var id=null,box=$('t-'+tab),px=tab+'_';
  async function show(){
    var r=await sb.from(table).select('*').order('sort');if(r.error)throw r.error;
    var e=id&&r.data.find(function(x){return x.id===id})||{};
    var h='<div class="glass pad"><h3 style="margin:0">'+title+(e.id?' (এডিট)':'')+'</h3>';
    F.forEach(function(f){var k=f[0],v=e[k];h+='<label class="lb">'+f[1]+'</label>';
      if(f[2]==='area')h+='<textarea class="f" id="'+px+k+'" style="height:100px">'+esc(v)+'</textarea>';
      else if(f[2]==='file')h+=(v?'<img src="'+esc(v)+'" alt="" style="height:48px;border-radius:8px;display:block">':'')+'<input class="f" id="'+px+k+'" type="file" accept="image/*">';
      else if(f[2]==='chk')h+='<label class="chk"><input type="checkbox" id="'+px+k+'"'+((e.id?v:true)?' checked':'')+'>সাইটে দেখাও</label>';
      else if(f[2]==='sel')h+='<select class="f" id="'+px+k+'">'+f[3].map(function(o){return'<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
      else h+='<input class="f" id="'+px+k+'"'+(f[2]==='num'?' type="number"':'')+' value="'+esc(v)+'">'});
    h+='<div class="err" id="'+px+'err"></div><button class="bt" id="'+px+'save">সেভ করো</button> '+(e.id?'<button class="bt s" id="'+px+'cancel">বাতিল</button>':'')+'</div><h3>সব তালিকা</h3>';
    r.data.forEach(function(x){h+='<div class="glass row"><span class="t">'+esc(lbl(x))+'</span>'+(x.published===false?'<span class="st d">লুকানো</span>':'')+'<button class="bt s sm" data-ed="'+x.id+'">এডিট</button><button class="bt s sm" data-dl="'+x.id+'">✕</button></div>'});
    box.innerHTML=h;
    $(px+'save').onclick=function(){run(async function(){
      var o={};
      if(!$(px+F[0][0]).value.trim()&&!$(px+F[1][0]).value.trim()){$(px+'err').textContent='অন্তত একটা শিরোনাম লেখো';return}
      for(var n=0;n<F.length;n++){var f=F[n],el=$(px+f[0]);
        if(f[2]==='file'){if(el.files[0])o[f[0]]=await up(el.files[0])}
        else if(f[2]==='chk')o[f[0]]=el.checked;
        else if(f[2]==='num')o[f[0]]=parseInt(el.value)||0;
        else o[f[0]]=el.value.trim()}
      var q=e.id?await sb.from(table).update(o).eq('id',e.id):await sb.from(table).insert(o);if(q.error)throw q.error;
      id=null;toast('সেভ হয়েছে');await show();
    })};
    if(e.id)$(px+'cancel').onclick=function(){id=null;run(show)};
  }
  box.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;run(async function(){
    if(b.dataset.ed){id=b.dataset.ed;await show();window.scrollTo(0,0)}
    else if(b.dataset.dl&&confirm('মুছে ফেলবে?')){var d=await sb.from(table).delete().eq('id',b.dataset.dl);if(d.error)throw d.error;toast('মুছে গেছে');await show()}
  })});
  return show;
}
var showEdu=crud('edu','education','শিক্ষা যোগ করো',[['title_bn','শিরোনাম (বাংলা)'],['title_en','Title (English)'],['sub_bn','বিবরণ (বাংলা)'],['sub_en','Detail (English)'],['status','অবস্থা','sel',[['ongoing','চলমান'],['done','সম্পন্ন']]],['sort','ক্রম (ছোট সংখ্যা আগে)','num']],function(x){return x.title_bn||x.title_en});
var showSvc=crud('svc','services','সার্ভিস যোগ করো',[['title_bn','সার্ভিসের নাম (বাংলা)'],['title_en','Name (English)'],['desc_bn','বিবরণ (বাংলা)','area'],['desc_en','Description (English)','area'],['price','দাম (যেমন ৫০০ ৳)'],['image_url','ছবি (ঐচ্ছিক)','file'],['published','দেখানো','chk'],['sort','ক্রম (ছোট সংখ্যা আগে)','num']],function(x){return (x.title_bn||x.title_en)+(x.price?' · '+x.price:'')});
var showSec=crud('sec','sections','নতুন সেকশন যোগ করো',[['title_bn','সেকশনের নাম (বাংলা)'],['title_en','Section title (English)'],['body_bn','লেখা (বাংলা)','area'],['body_en','Text (English)','area'],['image_url','ছবি (ঐচ্ছিক)','file'],['link_url','বাটনের লিংক (ঐচ্ছিক, https:// দিয়ে)'],['link_label','বাটনের লেখা'],['published','দেখানো','chk'],['sort','ক্রম (ছোট সংখ্যা আগে)','num']],function(x){return x.title_bn||x.title_en});
var TABS={set:async function(){showSet()},post:showPosts,like:showLikes,edu:showEdu,svc:showSvc,sec:showSec};
document.querySelector('.tabs').addEventListener('click',function(ev){var b=ev.target.closest('[data-tab]');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(function(n){n.className='bt'+(n===b?'':' s')});
  Object.keys(TABS).forEach(function(k){$('t-'+k).hidden=k!==b.dataset.tab});
  run(TABS[b.dataset.tab]);
});
async function enter(on){
  $('login').hidden=on;$('panel').hidden=!on;if(!on)return;
  var a=await sb.from('settings').select('data').eq('id',1).maybeSingle();if(a.data&&a.data.data)S=Object.assign({},DEF,a.data.data);showSet();
}
$('lg').onclick=function(){run(async function(){
  if(!$('le').value.trim()||!$('lp').value){$('e0').textContent='ইমেইল ও পাসওয়ার্ড দাও';return}
  var r=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});
  if(r.error){$('e0').textContent='লগইন হয়নি: '+(r.error.message||'অজানা সমস্যা');return}
  $('e0').textContent='';$('lp').value='';await enter(true);
})};
$('out').onclick=function(){run(async function(){await sb.auth.signOut();await enter(false)})};
run(async function(){var s=await sb.auth.getSession();await enter(!!s.data.session)});
</script>
</body>
</html>
